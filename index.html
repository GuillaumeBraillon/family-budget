<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Application de gestion financière familiale" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Budget familiale - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc;
        /* Prevent pull-to-refresh on mobile which feels web-like */
        overscroll-behavior-y: none;
      }
      /* Force input text color to be dark, ensuring visibility on Android Dark Mode */
      input,
      select,
      textarea {
        color: #0f172a !important; /* slate-900 */
      }
      /* Specific override for placeholders to ensure they are visible but distinct */
      ::placeholder {
        color: #94a3b8 !important; /* slate-400 */
        opacity: 1;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react-dom": "https://esm.sh/react-dom@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "vite": "https://esm.sh/vite@^7.3.0",
          "path": "https://esm.sh/path@^0.12.7",
          "recharts": "https://esm.sh/recharts@^3.6.0",
          "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
          "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "date-fns": "https://esm.sh/date-fns@^4.1.0",
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0",
          "@dnd-kit/core": "https://esm.sh/@dnd-kit/core@6.3.1?external=react,react-dom",
          "@dnd-kit/sortable": "https://esm.sh/@dnd-kit/sortable@10.0.0?external=react,react-dom,@dnd-kit/core,@dnd-kit/utilities",
          "@dnd-kit/utilities": "https://esm.sh/@dnd-kit/utilities@3.2.2?external=react,react-dom"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Enregistrement manuel du Service Worker pour PWA
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then(() => {})
            .catch((err) => console.error("SW registration failed: ", err));
        });
      }
    </script>
  </body>
</html>
